name: indicadores-db
# Banco PostgreSQL do indicador de zonas eleitorais.
# Usa as mesmas variáveis do .env do projeto (DB_USER, DB_PASSWORD, DB_NAME, DB_PORT),
# então o projeto conecta nele sem mudar nada.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Roda sozinho na PRIMEIRA criação do volume (cria a tabela e carrega os dados)
      - ./banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: